<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课程表 · 我的个人站</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="nav">
        <a class="brand" href="index.html">我的个人站</a>
        <div class="links">
            <a href="index.html">首页</a>
            <a href="memo.html">备忘录</a>
            <a href="schedule.html" class="active">课表</a>
            <a href="tools.html">工具箱</a>
        </div>
    </nav>

    <main class="page">
        <h2>📅 我的课程表</h2>
        <p class="tip">点击格子直接输入课程名，修改后自动保存。</p>
        <div class="table-wrap">
            <table id="scheduleTable"></table>
        </div>
        <div class="toolbar">
            <button id="importBtn" class="chip">📋 导入课表</button>
            <button id="exportBtn" class="chip">⬇️ 导出备份</button>
            <button id="clearSchedule" class="chip danger">清空课表</button>
        </div>
        <div id="importPanel" class="import-panel">
            <p class="tip">两种格式均可：① 从教务系统或课程表App复制的文本，需含「周一」「第1-2节」等关键字；② 本页导出备份生成的JSON。</p>
            <textarea id="importText" rows="9" placeholder="粘贴到此处..."></textarea>
            <div class="row">
                <button id="doImport" class="btn primary">解析并导入（覆盖现有）</button>
                <button id="cancelImport" class="btn ghost">取消</button>
            </div>
            <p id="importMsg" class="tip"></p>
        </div>
    </main>

    <footer><p>© 2026 我的个人站</p></footer>
    <script src="js/schedule.js"></script>
</body>
</html>
