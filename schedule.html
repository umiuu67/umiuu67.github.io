<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Umiuu 课程表：每周课程视图，支持文本导入与 JSON 备份。">
    <title>课程表 · Umiuu</title>
    <meta name="theme-color" content="#11152b">
    <link rel="canonical" href="https://umiuu67.github.io/schedule.html">
    <meta property="og:type" content="website">
    <meta property="og:title" content="课程表 · Umiuu">
    <meta property="og:description" content="每周课程视图，支持文本导入与 JSON 备份。">
    <meta property="og:url" content="https://umiuu67.github.io/schedule.html">
    <meta property="og:image" content="https://umiuu67.github.io/assets/favicon-512b.png">
    <meta name="twitter:card" content="summary">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32b.png">
    <link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48b.png">
    <link rel="icon" type="image/png" sizes="180x180" href="assets/favicon-180b.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180b.png">
    <link rel="stylesheet" href="css/style.css?v=22">
</head>
<body>
    <div id="box"></div>
    <nav class="nav" aria-label="主导航">
        <a class="brand" href="index.html">
            <img class="brand-logo" src="assets/favicon-48b.png" alt="67">
            Umiuu
        </a>
        <div class="links">
            <a href="index.html">首页</a>
            <a href="memo.html">备忘录</a>
            <a href="schedule.html" class="active" aria-current="page">课表</a>
            <a href="calendar.html">日历</a>
            <a href="https://www.ilovepdf.com/zh-cn" target="_blank" rel="noopener">工具箱 ↗</a>
            <a href="trash.html" title="作品集">垃圾桶</a>
        </div>
    </nav>

    <main class="page wide">
        <h1 class="sr-only">Umiuu 课程表</h1>
        <h2>我的课程表</h2>
        
        <div class="toolbar" style="justify-content:flex-start">
            <select id="termSel" style="width:auto; min-width:150px" aria-label="选择学期"></select>
            <select id="weekSel" style="width:auto; min-width:110px" aria-label="选择周次"></select>
            <button id="exportBtn" class="chip">导出备份</button>
            <button id="importBtn" class="chip">预览导入</button>
        </div>
        <div class="table-wrap">
            <table id="scheduleTable"><caption class="sr-only">每周课程表</caption></table>
        </div>
        <div id="importPanel" class="import-panel">
            <p class="tip">支持：① 完整课表JSON（导出备份的格式，整包预览）② 文本行（含「周X」「第X-X节」，可选「X-Y周」），将加入当前选中的学期，仅本页预览。</p>
            <textarea id="importText" rows="9" placeholder="粘贴到此处..." aria-label="课表导入内容"></textarea>
            <div class="row">
                <button id="doImport" class="btn primary">解析并导入（覆盖现有）</button>
                <button id="cancelImport" class="btn ghost">取消</button>
            </div>
            <p id="importMsg" class="tip"></p>
        </div>
    </main>

    <footer><p>© 2026 Umiuu · Powered by GitHub Pages</p></footer>
    <script src="js/schedule.js?v=22"></script>
    <script src="js/background.js?v=22"></script>
    <script src="js/enhance.js?v=22"></script>
</body>
</html>
