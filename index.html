<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人站</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="nav">
        <a class="brand" href="index.html">我的个人站</a>
        <div class="links">
            <a href="index.html" class="active">首页</a>
            <a href="memo.html">备忘录</a>
            <a href="schedule.html">课表</a>
            <a href="tools.html">工具箱</a>
        </div>
    </nav>

    <header class="hero">
        <h1>你好，我是<span class="highlight">你的名字</span></h1>
        <p class="subtitle">个人主页 · 备忘录 · 课程表 · 实用工具箱</p>
        <a class="btn" href="#apps">开始使用</a>
    </header>

    <section id="apps" class="section">
        <h2>我的应用</h2>
        <div class="cards">
            <a class="card link-card" href="memo.html">
                <h3>📝 备忘录</h3>
                <p>随手记录待办事项，勾选完成、一键删除，数据自动保存在本地浏览器。</p>
            </a>
            <a class="card link-card" href="schedule.html">
                <h3>📅 课程表</h3>
                <p>点击单元格即可编辑每周课程安排，自动保存，随时查看。</p>
            </a>
            <a class="card link-card" href="tools.html">
                <h3>🧰 简易工具箱</h3>
                <p>计算器、字数统计、随机数、倒计时、单位换算，日常小工具一应俱全。</p>
            </a>
        </div>
    </section>

    <section id="about" class="section alt">
        <h2>关于我</h2>
        <p>在这里写一段自我介绍：你是谁、做什么工作、有什么兴趣爱好。</p>
    </section>

    <footer>
        <p>© 2026 你的名字 · 由 GitHub Pages 托管</p>
    </footer>
</body>
</html>
