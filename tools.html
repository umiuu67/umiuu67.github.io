<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工具箱 · 我的个人站</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="nav">
        <a class="brand" href="index.html">我的个人站</a>
        <div class="links">
            <a href="index.html">首页</a>
            <a href="memo.html">备忘录</a>
            <a href="schedule.html">课表</a>
            <a href="tools.html" class="active">工具箱</a>
        </div>
    </nav>

    <main class="page wide">
        <h2>🧰 简易工具箱</h2>
        <div class="tool-grid">

            <section class="tool-card">
                <h3>计算器</h3>
                <div id="calcScreen">0</div>
                <div class="calc-keys">
                    <button data-k="C">C</button>
                    <button data-k="back">⌫</button>
                    <button data-k="/">÷</button>
                    <button data-k="*">×</button>
                    <button data-k="7">7</button>
                    <button data-k="8">8</button>
                    <button data-k="9">9</button>
                    <button data-k="-">−</button>
                    <button data-k="4">4</button>
                    <button data-k="5">5</button>
                    <button data-k="6">6</button>
                    <button data-k="+">+</button>
                    <button data-k="1">1</button>
                    <button data-k="2">2</button>
                    <button data-k="3">3</button>
                    <button data-k="=" class="eq">=</button>
                    <button data-k="0">0</button>
                    <button data-k=".">.</button>
                    <button data-k="(">(</button>
                    <button data-k=")">)</button>
                </div>
            </section>

            <section class="tool-card">
                <h3>字数统计</h3>
                <textarea id="wcInput" rows="6" placeholder="粘贴或输入文本..."></textarea>
                <ul class="stat-list">
                    <li>总字符：<b id="wcChars">0</b></li>
                    <li>不含空格：<b id="wcNoSpace">0</b></li>
                    <li>词数(按空白切分)：<b id="wcWords">0</b></li>
                    <li>行数：<b id="wcLines">0</b></li>
                </ul>
            </section>

            <section class="tool-card">
                <h3>随机数生成</h3>
                <div class="row">
                    <label>最小 <input id="randMin" type="number" value="1"></label>
                    <label>最大 <input id="randMax" type="number" value="100"></label>
                    <label>个数 <input id="randCount" type="number" value="1" min="1" max="100"></label>
                </div>
                <button id="randGo" class="btn primary">生成</button>
                <p id="randOut" class="result-box">-</p>
            </section>

            <section class="tool-card">
                <h3>倒计时</h3>
                <div class="row">
                    <label>分钟 <input id="timerMin" type="number" value="5" min="0"></label>
                    <label>秒 <input id="timerSec" type="number" value="0" min="0" max="59"></label>
                </div>
                <div id="timerShow" class="big-time">05:00</div>
                <div class="row">
                    <button id="timerStart" class="btn primary">开始</button>
                    <button id="timerReset" class="btn ghost">重置</button>
                </div>
            </section>

            <section class="tool-card">
                <h3>单位换算</h3>
                <div class="row">
                    <select id="convCat">
                        <option value="len">长度</option>
                        <option value="weight">重量</option>
                        <option value="data">数据大小</option>
                    </select>
                </div>
                <div class="row">
                    <input id="convIn" type="number" value="1">
                    <select id="convFrom"></select>
                    <span>=</span>
                    <input id="convOut" readonly>
                    <select id="convTo"></select>
                </div>
            </section>

        </div>
    </main>

    <footer><p>© 2026 我的个人站</p></footer>
    <script src="js/tools.js"></script>
</body>
</html>
