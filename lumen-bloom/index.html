<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Lumen Bloom - 光之画布</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #060709;
    cursor: crosshair;
    touch-action: none;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: block;
  }
  #hint {
    position: fixed;
    left: 50%;
    bottom: 42px;
    transform: translateX(-50%);
    color: rgba(235, 240, 248, 0.55);
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    letter-spacing: 0.35em;
    text-indent: 0.35em;
    pointer-events: none;
    opacity: 0;
    animation: hint-in 1.6s ease 0.8s forwards;
    transition: opacity 1.4s ease;
  }
  #hint.gone { opacity: 0 !important; }
  #brand {
    position: fixed;
    right: 28px;
    bottom: 24px;
    color: rgba(235, 240, 248, 0.28);
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 11px;
    letter-spacing: 0.5em;
    pointer-events: none;
    opacity: 0;
    animation: brand-in 2s ease 2.5s forwards;
  }
  @keyframes brand-in {
    to { opacity: 1; }
  }
  @keyframes hint-in {
    from { opacity: 0; transform: translateX(-50%) translateY(10px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="hint">移动搅动 · 点击绽放</div>
<div id="brand">LUMEN BLOOM</div>
<script src="app.js"></script>
</body>
</html>
