<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Umiuu 日历：把课程与备忘录合并到月历中查看。">
    <title>日历 · Umiuu</title>
    <meta name="theme-color" content="#11152b">
    <link rel="canonical" href="https://umiuu67.github.io/calendar.html">
    <meta property="og:type" content="website">
    <meta property="og:title" content="日历 · Umiuu">
    <meta property="og:description" content="把课程与备忘录合并到月历中查看。">
    <meta property="og:url" content="https://umiuu67.github.io/calendar.html">
    <meta property="og:image" content="https://umiuu67.github.io/assets/favicon-512b.png">
    <meta name="twitter:card" content="summary">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32b.png">
    <link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48b.png">
    <link rel="icon" type="image/png" sizes="180x180" href="assets/favicon-180b.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180b.png">
    <link rel="stylesheet" href="css/style.css?v=22">
</head>
<body>
    <div id="box"></div>
    <nav class="nav" aria-label="主导航">
        <a class="brand" href="index.html">
            <img class="brand-logo" src="assets/favicon-48b.png" alt="67">
            Umiuu
        </a>
        <div class="links">
            <a href="index.html">首页</a>
            <a href="memo.html">备忘录</a>
            <a href="schedule.html">课表</a>
            <a href="calendar.html" class="active" aria-current="page">日历</a>
            <a href="https://www.ilovepdf.com/zh-cn" target="_blank" rel="noopener">工具箱 ↗</a>
            <a href="trash.html" title="作品集">垃圾桶</a>
        </div>
    </nav>

    <main class="page wide">
        <h1 class="sr-only">Umiuu 日历</h1>
        <div class="cal-head">
            <button id="calPrev" class="chip" aria-label="上个月">‹ 上月</button>
            <h2 id="calTitle">2026年8月</h2>
            <div class="cal-head-right">
                <button id="calToday" class="chip" aria-label="回到今天">今天</button>
                <button id="calNext" class="chip" aria-label="下个月">下月 ›</button>
            </div>
        </div>

        <div class="cal-weekdays">
            <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
        </div>
        <div id="calGrid" class="cal-grid"></div>

        <div class="panel-grid">
            <section class="tool-card">
                <h3 id="panelCourseTitle">📚 当天课程</h3>
                <ul id="panelCourses" class="panel-list"></ul>
            </section>
            <section class="tool-card">
                <h3 id="panelMemoTitle">📝 当天备忘</h3>
                <ul id="panelMemos" class="panel-list"></ul>
                <form id="panelAddForm" class="memo-form">
                    <input id="panelAddInput" type="text" placeholder="给这天加一条备忘..." autocomplete="off" required>
                    <button type="submit" class="btn primary">添加</button>
                </form>
            </section>
        </div>
        <p class="tip" style="text-align:center">点击任意日期查看当天课程与备忘 · 数据与备忘录、课表实时互通</p>
    </main>

    <footer><p>© 2026 Umiuu · Powered by GitHub Pages</p></footer>
    <script src="js/calendar.js?v=22"></script>
    <script src="js/background.js?v=22"></script>
    <script src="js/enhance.js?v=22"></script>
</body>
</html>
