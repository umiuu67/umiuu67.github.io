<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STM32 学习模式</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32b.png">
<link rel="icon" type="image/png" sizes="48x48" href="../assets/favicon-48b.png">
<link rel="icon" type="image/png" sizes="180x180" href="../assets/favicon-180b.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/favicon-180b.png">
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0e14;
    --bg-soft: #0f1520;
    --panel: #131b28;
    --panel-2: #182233;
    --line: rgba(120, 200, 255, .10);
    --text: #d7e2ee;
    --text-dim: #8fa1b3;
    --accent: #4fd1c5;
    --accent-soft: rgba(79, 209, 197, .14);
    --warn: #f6ad55;
    --ok: #68d391;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    min-height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 22px;
    background: var(--bg-soft);
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 20;
  }
  header .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; white-space: nowrap; }
  header .brand img { width: 30px; height: 30px; border-radius: 7px; }
  header .progress-wrap { flex: 1; max-width: 520px; }
  header .progress-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
  header .progress-bar { height: 7px; border-radius: 4px; background: var(--panel-2); overflow: hidden; }
  header .progress-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), #63b3ed); transition: width .3s; }
  header .bili-link {
    margin-left: auto; text-decoration: none; color: #0a0e14;
    background: var(--accent); padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 14px;
    white-space: nowrap;
  }
  header .bili-link:hover { filter: brightness(1.1); }
  .layout { display: grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 61px); }
  aside {
    background: var(--bg-soft); border-right: 1px solid var(--line);
    overflow-y: auto; padding: 14px 0 40px; position: sticky; top: 61px; height: calc(100vh - 61px);
  }
  .phase-title {
    padding: 14px 18px 6px; font-size: 12px; letter-spacing: .12em;
    color: var(--accent); text-transform: uppercase; font-weight: 700;
  }
  .lesson-item {
    display: flex; align-items: center; gap: 9px;
    padding: 9px 18px; cursor: pointer; font-size: 13.5px; color: var(--text-dim);
    border-left: 3px solid transparent; transition: background .15s, color .15s;
  }
  .lesson-item:hover { background: var(--panel); color: var(--text); }
  .lesson-item.active { background: var(--accent-soft); color: var(--accent); border-left-color: var(--accent); font-weight: 600; }
  .lesson-item.done { color: var(--ok); }
  .lesson-item .pnum { font-size: 11px; background: var(--panel-2); border-radius: 5px; padding: 2px 6px; min-width: 34px; text-align: center; }
  .lesson-item .tick { margin-left: auto; font-size: 12px; }
  main { padding: 26px 34px 90px; max-width: 980px; }
  .crumb { font-size: 12.5px; color: var(--text-dim); margin-bottom: 8px; }
  h1 { font-size: 26px; margin-bottom: 10px; line-height: 1.3; }
  .meta-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .chip { font-size: 12px; padding: 4px 10px; border-radius: 6px; background: var(--panel-2); color: var(--text-dim); }
  .btn {
    border: none; cursor: pointer; font-family: inherit; font-size: 13.5px; font-weight: 600;
    padding: 8px 15px; border-radius: 8px; background: var(--panel-2); color: var(--text);
    display: inline-flex; align-items: center; gap: 6px; text-decoration: none; transition: filter .15s;
  }
  .btn:hover { filter: brightness(1.15); }
  .btn.primary { background: var(--accent); color: #08262e; }
  .btn.ghost { background: transparent; border: 1px solid var(--line); }
  .section-label { font-size: 13px; font-weight: 700; color: var(--accent); margin: 26px 0 10px; letter-spacing: .05em; }
  .ts-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .ts-grid a {
    font-size: 12.5px; text-decoration: none; color: var(--text-dim);
    background: var(--panel); border: 1px solid var(--line); padding: 6px 11px; border-radius: 7px;
  }
  .ts-grid a:hover { color: var(--accent); border-color: var(--accent); }
  .notes { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px 26px; line-height: 1.85; font-size: 14.5px; }
  .notes h2 { font-size: 18px; margin: 22px 0 10px; color: var(--accent); }
  .notes h2:first-child { margin-top: 0; }
  .notes h3 { font-size: 15.5px; margin: 18px 0 8px; color: #9ae6e0; }
  .notes p { margin: 8px 0; }
  .notes ul, .notes ol { margin: 8px 0 8px 22px; }
  .notes li { margin: 4px 0; }
  .notes code {
    background: #0d1420; border: 1px solid var(--line); border-radius: 5px;
    padding: 1px 6px; font-family: Consolas, "Courier New", monospace; font-size: 13px; color: #f6c177;
  }
  .notes pre {
    background: #0d1420; border: 1px solid var(--line); border-radius: 9px;
    padding: 14px 16px; overflow-x: auto; margin: 12px 0;
  }
  .notes pre code { background: none; border: none; padding: 0; color: #c9e3ff; line-height: 1.6; }
  .notes blockquote { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 10px 14px; border-radius: 0 8px 8px 0; margin: 12px 0; color: var(--text); }
  .notes strong { color: #ffd79a; }
  .points { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 22px; }
  .points li { margin: 7px 0 7px 20px; font-size: 14px; }
  .pager { display: flex; justify-content: space-between; margin-top: 30px; gap: 12px; }
  footer { text-align: center; color: var(--text-dim); font-size: 12px; padding: 30px 0 40px; }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    aside { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--line); max-height: 320px; }
    main { padding: 20px 16px 60px; }
    header { flex-wrap: wrap; }
    header .progress-wrap { order: 3; min-width: 100%; max-width: none; }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><img src="../assets/favicon-48b.png" alt="">STM32 学习模式</div>
  <div class="progress-wrap">
    <div class="progress-label"><span id="prog-text">0 / 54 节</span><span id="prog-pct">0%</span></div>
    <div class="progress-bar"><i id="prog-fill"></i></div>
  </div>
  <a class="bili-link" id="bili-open" target="_blank" rel="noopener">在 B 站打开本节 ↗</a>
</header>
<div class="layout">
  <aside id="sidebar"></aside>
  <main id="main"></main>
</div>
<footer>铁头山羊 STM32 入门教程 · 学习笔记 · Umiuu</footer>
<script src="./stm32-course-data.js"></script>
<script>
const $ = s => document.querySelector(s);
const KEY_DONE = 'stm32study.done';
const KEY_CUR = 'stm32study.cur';
let done = new Set(JSON.parse(localStorage.getItem(KEY_DONE) || '[]'));
let current = Math.min(parseInt(localStorage.getItem(KEY_CUR) || '1', 10) || 1, COURSE.lessons.length);

function biliUrl(page, t) {
  return `https://www.bilibili.com/video/${COURSE.meta.bvid}?p=${page}` + (t ? `&t=${t}` : '');
}
function fmt(sec) {
  const m = Math.floor(sec / 60), s = sec % 60;
  return (m >= 60 ? Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0');
}
function save() {
  localStorage.setItem(KEY_DONE, JSON.stringify([...done]));
  localStorage.setItem(KEY_CUR, String(current));
}
function renderProgress() {
  const n = done.size, total = COURSE.lessons.length;
  $('#prog-text').textContent = `${n} / ${total} 节`;
  $('#prog-pct').textContent = Math.round(n / total * 100) + '%';
  $('#prog-fill').style.width = (n / total * 100) + '%';
}
function renderSidebar() {
  let html = '';
  COURSE.phases.forEach(ph => {
    html += `<div class="phase-title">${ph.name}</div>`;
    COURSE.lessons.filter(l => l.phase === ph.id).forEach(l => {
      html += `<div class="lesson-item${l.page === current ? ' active' : ''}${done.has(l.page) ? ' done' : ''}" data-page="${l.page}">
        <span class="pnum">P${l.page}</span><span>${l.title}</span>
        <span class="tick">${done.has(l.page) ? '✓' : ''}</span></div>`;
    });
  });
  $('#sidebar').innerHTML = html;
  document.querySelectorAll('.lesson-item').forEach(el =>
    el.addEventListener('click', () => { current = +el.dataset.page; save(); render(); window.scrollTo(0, 0); }));
}
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function md(src) {
  const chunks = src.split(/```|~~~/);
  let out = '';
  chunks.forEach((c, i) => {
    if (i % 2) {
      out += '<pre><code>' + esc(c.replace(/^\n/, '').replace(/\n$/, '')) + '</code></pre>';
      return;
    }
    c.split(/\n\n+/).forEach(block => {
      const b = block.trim();
      if (!b) return;
      if (b.startsWith('### ')) {
        const nl = b.indexOf('\n');
        out += `<h3>${inline(nl === -1 ? b.slice(4) : b.slice(4, nl))}</h3>`;
        if (nl !== -1) out += md(b.slice(nl + 1));
      }
      else if (b.startsWith('## ')) {
        const nl = b.indexOf('\n');
        out += `<h2>${inline(nl === -1 ? b.slice(3) : b.slice(3, nl))}</h2>`;
        if (nl !== -1) out += md(b.slice(nl + 1));
      }
      else if (b.startsWith('> ')) out += `<blockquote>${inline(b.replace(/^> ?/gm, ''))}</blockquote>`;
      else if (/^[-*] /m.test(b)) out += '<ul>' + b.split('\n').filter(x => /^[-*] /.test(x.trim())).map(x => `<li>${inline(x.trim().slice(2))}</li>`).join('') + '</ul>';
      else if (/^\d+\. /.test(b)) out += '<ol>' + b.split('\n').filter(x => /^\d+\. /.test(x.trim())).map(x => `<li>${inline(x.trim().replace(/^\d+\. /, ''))}</li>`).join('') + '</ol>';
      else out += `<p>${inline(b.replace(/\n/g, '<br>'))}</p>`;
    });
  });
  return out;
  function inline(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  }
}
function render() {
  const l = COURSE.lessons[current - 1];
  document.title = `P${l.page} ${l.title} · STM32 学习模式`;
  const phase = COURSE.phases.find(p => p.id === l.phase);
  $('#bili-open').href = biliUrl(l.page);
  let html = `<div class="crumb">${phase ? phase.name : ''} · 铁头山羊 STM32 入门教程</div>
    <h1>P${l.page} ${l.title}</h1>
    <div class="meta-row">
      <span class="chip">时长 ${fmt(l.duration)}</span>
      <button class="btn ${done.has(l.page) ? 'ghost' : 'primary'}" id="mark-btn">${done.has(l.page) ? '已完成 ✓' : '标记完成'}</button>
    </div>`;
  if (l.ts && l.ts.length) {
    html += `<div class="section-label">时间戳导航</div><div class="ts-grid">` +
      l.ts.map(t => `<a href="${biliUrl(l.page, t.t)}" target="_blank" rel="noopener">[${fmt(t.t)}] ${t.label}</a>`).join('') + `</div>`;
  }
  html += `<div class="section-label">本节笔记</div><div class="notes">${md(l.notes || '笔记整理中…')}</div>`;
  if (l.points && l.points.length) {
    html += `<div class="section-label">要点清单</div><div class="points"><ul>` +
      l.points.map(p => `<li>${p}</li>`).join('') + `</ul></div>`;
  }
  html += `<div class="pager">
    ${current > 1 ? `<button class="btn ghost" id="prev-btn">← 上一节</button>` : '<span></span>'}
    ${current < COURSE.lessons.length ? `<button class="btn primary" id="next-btn">下一节 →</button>` : '<span></span>'}
  </div>`;
  $('#main').innerHTML = html;
  $('#mark-btn').addEventListener('click', () => {
    done.has(l.page) ? done.delete(l.page) : done.add(l.page);
    save(); renderProgress(); renderSidebar();
    const b = $('#mark-btn');
    b.textContent = done.has(l.page) ? '已完成 ✓' : '标记完成';
    b.className = 'btn ' + (done.has(l.page) ? 'ghost' : 'primary');
  });
  const pv = $('#prev-btn'), nx = $('#next-btn');
  if (pv) pv.addEventListener('click', () => { current--; save(); render(); window.scrollTo(0, 0); });
  if (nx) nx.addEventListener('click', () => { current++; save(); render(); window.scrollTo(0, 0); });
  renderProgress(); renderSidebar();
}
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowRight' && current < COURSE.lessons.length) { current++; save(); render(); window.scrollTo(0, 0); }
  if (e.key === 'ArrowLeft' && current > 1) { current--; save(); render(); window.scrollTo(0, 0); }
});
render();
</script>
</body>
</html>
